<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldGate - Two-Factor Authentication</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { color: #333; font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .logo p { color: #666; font-size: 14px; }

        .tenant-info {
            background: #e8f4fd;
            border: 1px solid #bee5eb;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .tenant-info .tenant-name { font-weight: 600; color: #0c5460; font-size: 14px; }

        .error-message {
            background: #fdecea;
            border: 1px solid #f5c6cb;
            color: #721c24;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        .code-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            text-align: center;
            font-size: 24px !important;
            letter-spacing: 8px;
            font-family: 'SF Mono', SFMono-Regular, Consolas, monospace;
        }
        .code-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .security-info {
            text-align: center;
            color: #666;
            font-size: 12px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🛡️ ShieldGate</h1>
            <p>Two-Factor Authentication</p>
        </div>

        {{if .tenant_info}}
        <div class="tenant-info">
            <div class="tenant-name">{{.tenant_info.name}}</div>
        </div>
        {{end}}

        {{if .error}}
        <div class="error-message">{{.error}}</div>
        {{end}}

        <form method="POST" action="/oauth/mfa">
            <input type="hidden" name="mfa_token" value="{{.mfa_token}}">
            <input type="hidden" name="client_id" value="{{.client_id}}">
            <input type="hidden" name="redirect_uri" value="{{.redirect_uri}}">
            <input type="hidden" name="scope" value="{{.scope}}">
            <input type="hidden" name="state" value="{{.state}}">
            <input type="hidden" name="code_challenge" value="{{.code_challenge}}">
            <input type="hidden" name="code_challenge_method" value="{{.code_challenge_method}}">
            <input type="hidden" name="nonce" value="{{.nonce}}">
            <input type="hidden" name="csrf_token" value="{{.csrf_token}}">

            <div class="form-group">
                <label for="code">Enter the 6-digit code from your authenticator app</label>
                <input type="text" id="code" name="code" required autofocus
                       class="code-input" placeholder="000000"
                       inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code">
            </div>

            <button type="submit" class="btn">Verify</button>
        </form>

        <div class="security-info">
            🔒 Open your authenticator app to view your code.
        </div>
    </div>
</body>
</html>
