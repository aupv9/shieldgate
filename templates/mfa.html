<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldGate - Two-step verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        h1 { font-size: 22px; color: #333; margin-bottom: 12px; text-align: center; }
        p { color: #666; font-size: 14px; line-height: 1.5; margin-bottom: 24px; text-align: center; }
        .hint { font-size: 13px; margin: 16px 0 0; }

        label { display: block; font-size: 14px; font-weight: 500; color: #333; margin-bottom: 6px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 20px;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 16px;
        }
        input:focus { outline: none; border-color: #667eea; }

        .error {
            background: #fdecea;
            color: #b42318;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Two-step verification</h1>
        <p>Enter the 6-digit code from your authenticator app.</p>
        {{if .error}}<div class="error">{{.error}}</div>{{end}}
        <form method="POST" action="{{.action}}">
            {{range $name, $value := .hidden}}
            <input type="hidden" name="{{$name}}" value="{{$value}}">
            {{end}}
            <input type="hidden" name="mfa_token" value="{{.mfa_token}}">
            <input type="hidden" name="csrf_token" value="{{.csrf_token}}">
            <label for="code">Verification code</label>
            <input type="text" id="code" name="code" required autofocus
                   autocomplete="one-time-code" maxlength="11" spellcheck="false">
            <button type="submit">Verify</button>
        </form>
        <p class="hint">Lost your device? Enter one of your recovery codes instead.</p>
    </div>
</body>
</html>
