<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldGate - Signed Out</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .container h1 { color: #333; font-size: 26px; margin-bottom: 12px; }
        .container p { color: #666; font-size: 15px; line-height: 1.5; }
        .icon { font-size: 44px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">👋</div>
        <h1>You have been signed out</h1>
        <p>Your session has ended. You can safely close this window.</p>
    </div>
</body>
</html>
