<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldGate - Sign Out</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 { font-size: 22px; color: #333; margin-bottom: 12px; }
        p { color: #666; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body>
    <div class="card">
        {{if .confirm}}
        <h1>Sign out?</h1>
        <p>You will be signed out of all applications that use this account.</p>
        <form method="POST" action="/oauth/logout">
            <input type="hidden" name="client_id" value="{{.client_id}}">
            <input type="hidden" name="post_logout_redirect_uri" value="{{.post_logout_redirect_uri}}">
            <input type="hidden" name="state" value="{{.state}}">
            <input type="hidden" name="csrf_token" value="{{.csrf_token}}">
            <button type="submit">Sign out</button>
        </form>
        {{else}}
        <h1>You have signed out</h1>
        <p>You can now close this window.</p>
        {{end}}
    </div>
</body>
</html>
